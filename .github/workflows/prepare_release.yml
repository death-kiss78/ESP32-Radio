name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  prepare-release:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Increment version
        id: version
        run: |
          python3 << 'EOF'
          import re
          from pathlib import Path

          options = Path("src/core/options.h")

          text = options.read_text(encoding="utf-8")

          m = re.search(
              r'#define\s+RADIOVERSION\s+"(\d+)\.(\d+)\.(\d+)"',
              text
          )

          if not m:
              raise SystemExit("RADIOVERSION not found")

          major = int(m.group(1))
          minor = int(m.group(2))
          patch = int(m.group(3))

          patch += 1

          if patch > 999:
              patch = 0
              minor += 1

          if minor > 999:
              minor = 0
              major += 1

          version = f"{major}.{minor}.{patch}"

          text = re.sub(
              r'(#define\s+RADIOVERSION\s+")([^"]+)(")',
              rf'\g<1>{version}\g<3>',
              text
          )

          options.write_text(text, encoding="utf-8")

          with open("version.txt", "w") as f:
              f.write(version)

          print(version)
          EOF

          VERSION=$(cat version.txt)

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "New version: $VERSION"

      - name: Run prepare_releases.py
        run: |
          python3 builds/prepare_releases.py --yes --no-build

      - name: Commit updated files
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/core/options.h
          git add builds/releases/

          git commit -m "Release ${VERSION}" || echo "Nothing to commit"

      - name: Create tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "${VERSION}"

      - name: Push changes and tag
        run: |
          git push
          git push origin "${{ steps.version.outputs.version }}"

  build-release:
    needs: prepare-release

    uses: ./.github/workflows/build-and-release.yml

    with:
      version: ${{ needs.prepare-release.outputs.version }}