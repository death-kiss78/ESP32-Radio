[platformio]
src_dir = ./src
data_dir = ./data

; -----------------------------------------------------------------------
; ES3C28S (generated by https://death-kiss78.github.io/myRadio/myoptions/generator.html)
; https://death-kiss78.github.io/myRadio/myoptions/generator.html#%3D%3D
; -----------------------------------------------------------------------
; patch_pio_ini_files can automatically patch this file

[myradio]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=0 ; Set to 0 for no debug; saves memory / 5 for full debug (> 0 adds 1s delay after cold boot to ensure serial logs fully visible)
  -include src/core/options_overrides.h ; some libraries need overrides forced in early
lib_deps =
  ; These libraries are not optional (version numbers here should work but you can try newer/older versions)
  bblanchon/ArduinoJson@7.4.3
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  ESP32Async/ESPAsyncWebServer@3.12.1
  ESP32Async/AsyncTCP@3.5.0
  elims/PsychicMqttClient@0.2.4
  trip5/ESPFileUpdater@1.6.0
  trip5/ehDP@1.0.0
  jnthas/Improv WiFi Library@0.0.4
build_src_filter =
  -<*> ; exclude all files by default
  +<../myoptions.h>
  +<main.cpp>
  +<core/*>
  +<displays/*>
  +<locale/*>
  ; additional local libraries can be included in each environment as so:
  ;+<libraries/ES8311_Audio/*> ; for ES8311 Audio
; These scripts package do pre- and post-steps to make sure LittleFS gets .gz files for www
extra_scripts = pre:builds/platformio_pre_gzip_www.py, post:builds/platformio_post_gzip_www.py

; -----------------------------------------------------------------------
; Optional External Libraries (here to simplify version number updating)
; Add them under lib_deps like: ${library.onebutton}
; -----------------------------------------------------------------------
[library]
onebutton          = mathertel/OneButton@2.6.2
rotaryencoder      = igorantolic/Ai Esp32 Rotary Encoder@1.7
irremote           = crankyoldgit/IRremoteESP8266@2.9.0
neopixel           = adafruit/Adafruit NeoPixel@1.15.4
rtclib             = adafruit/RTClib@2.1.4
; Displays (may be incomplete, some are local libraries)
gc9a01a            = adafruit/Adafruit GC9A01A@1.1.0 ; untested - may need to try 1.0.0
ili9341            = adafruit/Adafruit ILI9341@1.6.2 ; SPI TFT
sh110x             = adafruit/Adafruit SH110X@2.1.14 ; OLED
ssd1305            = adafruit/Adafruit SSD1305@2.2.3 ; untested
ssd1306            = adafruit/Adafruit SSD1306@2.5.16 ; OLED
ssd1327            = adafruit/Adafruit SSD1327@1.0.4 ; Nice
st7735             = adafruit/Adafruit ST7735 and ST7789 Library@1.11.0 ; SPI TFT (Red Board, probably others)
st7789             = ${library.st7735} ; alias
; Touchscreens
tamc_gt911         = tamctec/TAMC_GT911@1.0.2 ; untested but should be fine
xpt2046            = https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; -----------------------------------------------------------------------
; Board: ESP32-S3 ES3C28S (ESP32-S3-N16R8)(4.0)
; -----------------------------------------------------------------------
[es3c28s]
extends = myradio
board = esp32-s3-devkitc-1
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = builds/partitions/default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
  ${myradio.build_flags}
  -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; -----------------------------------------------------------------------
; RADIO FIRMWARES
; -----------------------------------------------------------------------
[env:es3c28s]
extends = es3c28s
build_flags =
  ${es3c28s.build_flags}
  -Des3c28s
lib_deps =
  ${myradio.lib_deps}
  ${library.rotaryencoder}
  ${library.onebutton}
  ${library.neopixel}
  ${library.irremote}
build_src_filter =
  ${myradio.build_src_filter}
  +<libraries/Adafruit_ST7796S/*>
  +<libraries/I2S_Audio/*>
  +<libraries/ES8311_Audio/*>
  +<libraries/FT6336_Touchscreen/*>
